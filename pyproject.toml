[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agreementatlas"
version = "0.1.0"
description = "Local-first legal knowledge graphs and evidence-grounded chat for software and cloud agreements"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "AgreementAtlas contributors" }
]
keywords = [
  "legal-rag",
  "knowledge-graph",
  "software-licensing",
  "cloud-agreements",
  "lm-studio",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Only the converters for the formats the upload endpoint accepts. `[all]`
  # also pulls YouTube and audio transcription and three Azure cloud SDKs --
  # one of them a beta -- which nothing here calls, and whose
  # youtube-transcript-api pin has no installable distribution on CI.
  "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.6,<0.2",
  "pandas>=2.3,<3",
  "pdfplumber>=0.11.10,<0.12",
  "python-dotenv>=1.0,<2",
  "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.12,<1",
]
graphrag = [
  "graphrag>=3.1,<4",
]

[project.scripts]
agreementatlas = "app:main"
agreementatlas-evaluate = "evaluation:main"

[project.urls]
Documentation = "https://github.com/jmangan415/agreementatlas#readme"
Issues = "https://github.com/jmangan415/agreementatlas/issues"

[tool.setuptools]
py-modules = [
  "app",
  "evaluation",
  "legal_graph_service",
  "legal_ingest",
  "legal_schema",
  "lmstudio_client",
  "session_store",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".venv",
  "data",
  "knowledge",
  "tmp",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
